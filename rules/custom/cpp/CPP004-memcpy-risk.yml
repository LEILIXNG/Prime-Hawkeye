rules:
  - id: CPP004
    languages: [cpp]
    severity: WARNING
    message: "Potential memory-copy risk: verify that the copy length does not exceed the destination buffer size."
    metadata:
      name: Potential unsafe bounded copy
      # memmove and strncpy take the same (destination, source, length) shape
      # as memcpy and share the identical overflow condition, so one bounds
      # check (_memcpy_bounds_status in cpp_validators.py) covers all three.
      description: Detects calls to memcpy, memmove, and strncpy; compares known destination capacities and copy lengths, retaining unknown cases for review.
      confidence: MEDIUM
      hawkeye_language: cpp
      hawkeye_validator: [standard-function-call, memcpy-bounds]
      hawkeye_verification: static
      hawkeye_remediation: Use the destination capacity as the upper bound and reject or truncate larger copy lengths.
      cwe: ["CWE-120: Buffer Copy without Checking Size of Input"]
    patterns:
      - pattern: $FUNC(...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: '^(?:::)?(?:std::)?(?:memcpy|memmove|strncpy)$'
